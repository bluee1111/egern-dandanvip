name: "蛋蛋不语 · 调试探针"
description: "四段自检：①HTTP明文 ②HTTPS解密 ③蛋蛋不语接口 ④全量域名上报。命中就弹通知，不改响应体。排查完删除。"
author: "bluee1111"
homepage: "https://github.com/bluee1111/egern-dandanvip"
icon: "ladybug.fill"

# 纯观察：命中就通知，不修改任何响应
scriptings:
  # ① 明文 HTTP 测试：只要 Egern 的重写引擎在跑，开 http://example.com 就该弹
  - http_response:
      name: "探针① HTTP明文"
      match: "^http://(example\\.com|ip-api\\.com|neverssl\\.com|captive\\.apple\\.com)/"
      script_url: "https://cdn.jsdelivr.net/gh/bluee1111/egern-dandanvip@main/dandanvip-debug.js"
      body_required: true
      timeout: 30
      max_size: 4194304

  # ② HTTPS 解密测试：证书没信任 / 解密没开，这条不会弹
  - http_response:
      name: "探针② HTTPS解密"
      match: "^https://(www\\.)?baidu\\.com/"
      script_url: "https://cdn.jsdelivr.net/gh/bluee1111/egern-dandanvip@main/dandanvip-debug.js"
      body_required: true
      timeout: 30
      max_size: 4194304

  # ③ 蛋蛋不语本体
  - http_response:
      name: "探针③ 蛋蛋不语"
      match: "^https?://38\\.76\\.202\\.248(:[0-9]+)?/"
      script_url: "https://cdn.jsdelivr.net/gh/bluee1111/egern-dandanvip@main/dandanvip-debug.js"
      body_required: true
      timeout: 30
      max_size: 4194304

  # ④ 全量明文 HTTP 域名探针：把 App 访问的每个域名报一次（永久去重）
  #    ⭐ 标记的是 App 启动自检域名（captive.apple.com / icanhazip.com / one.one.one.one），出现即说明 App 流量确实在走 Egern
  - http_response:
      name: "探针④ 全量域名"
      match: "^http://"
      script_url: "https://cdn.jsdelivr.net/gh/bluee1111/egern-dandanvip@main/dandanvip-hosts.js"
      body_required: false
      timeout: 10

mitm:
  hostnames:
    includes:
      - "38.76.202.248"
      - "example.com"
      - "ip-api.com"
      - "neverssl.com"
      - "captive.apple.com"
      - "baidu.com"
      - "www.baidu.com"
